<mat-sidenav-container autosize>

  <mat-sidenav [ngClass]="!isCollapsed ? 'expanded' : 'collapsed'" [mode]="'side'" [opened]="'true'"
    (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
    <mat-nav-list>
      <a mat-list-item>
        <span class="entry">
          <mat-icon [ngStyle]="{'color':'white'}" (click)="toggleMenu()">menu</mat-icon>
        </span>
      </a>
      @for (item of pagesInfoObservable|async; track $index) {
      <a mat-list-item [routerLinkActive]="'nav-link active'" routerLink={{item.pageRoute}}>
        <span class="entry">
          <mat-icon [ngStyle]="{'color':'white'}"> {{item.icon}}</mat-icon>
          <span *ngIf="!isCollapsed">{{item.pageName}}</span>
        </span>
      </a>
      }
    </mat-nav-list>
  </mat-sidenav>
